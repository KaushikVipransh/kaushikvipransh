  <circle cx="430" cy="220" r="4.0" fill="#A0AAB4" opacity="0.81" filter="url(#glow-silver)">
    <animate attributeName="opacity" values="0.81;0.36;0.81" dur="3.2s" begin="1.4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4.0;3.3;4.0" dur="3.2s" begin="1.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="790" cy="220" r="3.3" fill="#A0AAB4" opacity="0.76" filter="url(#glow-silver)">
    <animate attributeName="opacity" values="0.76;0.33;0.76" dur="3.7s" begin="1.6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3.3;2.7;3.3" dur="3.7s" begin="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Steel stars — low activity -->
  <circle cx="290" cy="110" r="2.8" fill="#718096" opacity="0.68" filter="url(#glow-steel)">
