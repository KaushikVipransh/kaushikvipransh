<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <defs>
    <filter id="glow-chrome" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-silver" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-steel" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.0" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0c0f16"/>
      <stop offset="100%" stop-color="#060810"/>
    </radialGradient>
    <radialGradient id="nebula1" cx="30%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#A0AAB4" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="70%" cy="60%" r="35%">
      <stop offset="0%" stop-color="#4A5568" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula3" cx="55%" cy="25%" r="30%">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="300" fill="url(#bg)" rx="12"/>
  <rect width="900" height="300" fill="url(#nebula1)" rx="12"/>
  <rect width="900" height="300" fill="url(#nebula2)" rx="12"/>
  <rect width="900" height="300" fill="url(#nebula3)" rx="12"/>

  <!-- Constellation lines — silver -->
  <line x1="120" y1="80" x2="195" y2="60" stroke="#A0AAB4" stroke-opacity="0.18" stroke-width="0.6"/>
  <line x1="195" y1="60" x2="290" y2="110" stroke="#A0AAB4" stroke-opacity="0.18" stroke-width="0.6"/>
  <line x1="290" y1="110" x2="380" y2="75" stroke="#A0AAB4" stroke-opacity="0.18" stroke-width="0.6"/>
  <line x1="380" y1="75" x2="470" y2="130" stroke="#A0AAB4" stroke-opacity="0.18" stroke-width="0.6"/>
  <line x1="470" y1="130" x2="560" y2="95" stroke="#A0AAB4" stroke-opacity="0.18" stroke-width="0.6"/>
  <line x1="560" y1="95" x2="650" y2="140" stroke="#A0AAB4" stroke-opacity="0.18" stroke-width="0.6"/>
  <line x1="650" y1="140" x2="740" y2="85" stroke="#A0AAB4" stroke-opacity="0.18" stroke-width="0.6"/>
  <line x1="740" y1="85" x2="810" y2="120" stroke="#A0AAB4" stroke-opacity="0.18" stroke-width="0.6"/>
  <line x1="120" y1="80" x2="160" y2="160" stroke="#718096" stroke-opacity="0.14" stroke-width="0.6"/>
  <line x1="195" y1="60" x2="250" y2="200" stroke="#718096" stroke-opacity="0.14" stroke-width="0.6"/>
  <line x1="380" y1="75" x2="430" y2="220" stroke="#718096" stroke-opacity="0.14" stroke-width="0.6"/>
  <line x1="560" y1="95" x2="520" y2="210" stroke="#718096" stroke-opacity="0.14" stroke-width="0.6"/>
  <line x1="740" y1="85" x2="700" y2="195" stroke="#718096" stroke-opacity="0.14" stroke-width="0.6"/>
  <line x1="160" y1="160" x2="250" y2="200" stroke="#A0AAB4" stroke-opacity="0.15" stroke-width="0.6"/>
  <line x1="250" y1="200" x2="340" y2="170" stroke="#A0AAB4" stroke-opacity="0.15" stroke-width="0.6"/>
  <line x1="340" y1="170" x2="430" y2="220" stroke="#A0AAB4" stroke-opacity="0.15" stroke-width="0.6"/>
  <line x1="430" y1="220" x2="520" y2="210" stroke="#A0AAB4" stroke-opacity="0.15" stroke-width="0.6"/>
  <line x1="520" y1="210" x2="620" y2="240" stroke="#A0AAB4" stroke-opacity="0.15" stroke-width="0.6"/>
  <line x1="620" y1="240" x2="700" y2="195" stroke="#A0AAB4" stroke-opacity="0.15" stroke-width="0.6"/>
  <line x1="700" y1="195" x2="790" y2="220" stroke="#A0AAB4" stroke-opacity="0.15" stroke-width="0.6"/>

  <!-- Chrome stars — high activity -->
  <circle cx="195" cy="60" r="4.5" fill="#E2E8F0" opacity="0.93" filter="url(#glow-chrome)">
    <animate attributeName="opacity" values="0.93;0.42;0.93" dur="2.8s" begin="0.3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4.5;3.7;4.5" dur="2.8s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="380" cy="75" r="5.1" fill="#E2E8F0" opacity="0.95" filter="url(#glow-chrome)">
    <animate attributeName="opacity" values="0.95;0.43;0.95" dur="2.5s" begin="0.2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="5.1;4.2;5.1" dur="2.5s" begin="0.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="560" cy="95" r="4.2" fill="#E2E8F0" opacity="0.91" filter="url(#glow-chrome)">
    <animate attributeName="opacity" values="0.91;0.41;0.91" dur="2.7s" begin="0.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4.2;3.4;4.2" dur="2.7s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="740" cy="85" r="4.8" fill="#E2E8F0" opacity="0.94" filter="url(#glow-chrome)">
    <animate attributeName="opacity" values="0.94;0.42;0.94" dur="2.6s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4.8;3.9;4.8" dur="2.6s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
