<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <defs>
    <filter id="glow-amber" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-red" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-emerald" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0f1620"/>
      <stop offset="100%" stop-color="#060a0e"/>
    </radialGradient>
    <radialGradient id="nebula1" cx="30%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="70%" cy="60%" r="35%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula3" cx="55%" cy="25%" r="30%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="300" fill="url(#bg)" rx="12"/>
  <rect width="900" height="300" fill="url(#nebula1)" rx="12"/>
  <rect width="900" height="300" fill="url(#nebula2)" rx="12"/>
  <rect width="900" height="300" fill="url(#nebula3)" rx="12"/>

  <!-- Constellation lines -->
  <line x1="120" y1="80" x2="195" y2="60" stroke="#F59E0B" stroke-opacity="0.2" stroke-width="0.6"/>
  <line x1="195" y1="60" x2="290" y2="110" stroke="#F59E0B" stroke-opacity="0.2" stroke-width="0.6"/>
  <line x1="290" y1="110" x2="380" y2="75" stroke="#F59E0B" stroke-opacity="0.2" stroke-width="0.6"/>
  <line x1="380" y1="75" x2="470" y2="130" stroke="#F59E0B" stroke-opacity="0.2" stroke-width="0.6"/>
  <line x1="470" y1="130" x2="560" y2="95" stroke="#F59E0B" stroke-opacity="0.2" stroke-width="0.6"/>
  <line x1="560" y1="95" x2="650" y2="140" stroke="#F59E0B" stroke-opacity="0.2" stroke-width="0.6"/>
  <line x1="650" y1="140" x2="740" y2="85" stroke="#F59E0B" stroke-opacity="0.2" stroke-width="0.6"/>
  <line x1="740" y1="85" x2="810" y2="120" stroke="#F59E0B" stroke-opacity="0.2" stroke-width="0.6"/>
  <line x1="120" y1="80" x2="160" y2="160" stroke="#10B981" stroke-opacity="0.15" stroke-width="0.6"/>
  <line x1="195" y1="60" x2="250" y2="200" stroke="#10B981" stroke-opacity="0.15" stroke-width="0.6"/>
  <line x1="380" y1="75" x2="430" y2="220" stroke="#10B981" stroke-opacity="0.15" stroke-width="0.6"/>
  <line x1="560" y1="95" x2="520" y2="210" stroke="#10B981" stroke-opacity="0.15" stroke-width="0.6"/>
  <line x1="740" y1="85" x2="700" y2="195" stroke="#10B981" stroke-opacity="0.15" stroke-width="0.6"/>
  <line x1="160" y1="160" x2="250" y2="200" stroke="#F59E0B" stroke-opacity="0.15" stroke-width="0.6"/>
  <line x1="250" y1="200" x2="340" y2="170" stroke="#F59E0B" stroke-opacity="0.15" stroke-width="0.6"/>
  <line x1="340" y1="170" x2="430" y2="220" stroke="#F59E0B" stroke-opacity="0.15" stroke-width="0.6"/>
  <line x1="430" y1="220" x2="520" y2="210" stroke="#F59E0B" stroke-opacity="0.15" stroke-width="0.6"/>
  <line x1="520" y1="210" x2="620" y2="240" stroke="#F59E0B" stroke-opacity="0.15" stroke-width="0.6"/>
  <line x1="620" y1="240" x2="700" y2="195" stroke="#F59E0B" stroke-opacity="0.15" stroke-width="0.6"/>
  <line x1="700" y1="195" x2="790" y2="220" stroke="#F59E0B" stroke-opacity="0.15" stroke-width="0.6"/>

  <!-- Stars — amber (medium activity) -->
  <circle cx="120" cy="80" r="3.2" fill="#F59E0B" opacity="0.85" filter="url(#glow-amber)">
    <animate attributeName="opacity" values="0.85;0.38;0.85" dur="3.1s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3.2;2.6;3.2" dur="3.1s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="195" cy="60" r="4.5" fill="#EF4444" opacity="0.92" filter="url(#glow-red)">
    <animate attributeName="opacity" values="0.92;0.42;0.92" dur="2.8s" begin="0.3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4.5;3.7;4.5" dur="2.8s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="290" cy="110" r="2.8" fill="#F59E0B" opacity="0.75" filter="url(#glow-amber)">
    <animate attributeName="opacity" values="0.75;0.33;0.75" dur="3.6s" begin="0.7s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2.8;2.3;2.8" dur="3.6s" begin="0.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="380" cy="75" r="5.1" fill="#EF4444" opacity="0.95" filter="url(#glow-red)">
    <animate attributeName="opacity" values="0.95;0.43;0.95" dur="2.5s" begin="0.2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="5.1;4.2;5.1" dur="2.5s" begin="0.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="470" cy="130" r="3.5" fill="#F59E0B" opacity="0.80" filter="url(#glow-amber)">
    <animate attributeName="opacity" values="0.80;0.36;0.80" dur="3.3s" begin="1.1s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3.5;2.9;3.5" dur="3.3s" begin="1.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="560" cy="95" r="4.2" fill="#EF4444" opacity="0.90" filter="url(#glow-red)">
    <animate attributeName="opacity" values="0.90;0.41;0.90" dur="2.7s" begin="0.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4.2;3.4;4.2" dur="2.7s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="650" cy="140" r="3.0" fill="#F59E0B" opacity="0.78" filter="url(#glow-amber)">
    <animate attributeName="opacity" values="0.78;0.35;0.78" dur="3.8s" begin="0.9s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3.0;2.5;3.0" dur="3.8s" begin="0.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="740" cy="85" r="4.8" fill="#EF4444" opacity="0.93" filter="url(#glow-red)">
    <animate attributeName="opacity" values="0.93;0.42;0.93" dur="2.6s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4.8;3.9;4.8" dur="2.6s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="810" cy="120" r="2.6" fill="#F59E0B" opacity="0.72" filter="url(#glow-amber)">
    <animate attributeName="opacity" values="0.72;0.32;0.72" dur="4.0s" begin="1.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2.6;2.1;2.6" dur="4.0s" begin="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Stars — emerald (low-medium) -->
  <circle cx="160" cy="160" r="2.4" fill="#10B981" opacity="0.70" filter="url(#glow-emerald)">
    <animate attributeName="opacity" values="0.70;0.30;0.70" dur="4.2s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2.4;1.9;2.4" dur="4.2s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="200" r="3.4" fill="#10B981" opacity="0.78" filter="url(#glow-emerald)">
    <animate attributeName="opacity" values="0.78;0.35;0.78" dur="3.5s" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3.4;2.8;3.4" dur="3.5s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="340" cy="170" r="2.9" fill="#10B981" opacity="0.73" filter="url(#glow-emerald)">
    <animate attributeName="opacity" values="0.73;0.32;0.73" dur="3.9s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2.9;2.4;2.9" dur="3.9s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="430" cy="220" r="4.0" fill="#F59E0B" opacity="0.82" filter="url(#glow-amber)">
    <animate attributeName="opacity" values="0.82;0.37;0.82" dur="3.2s" begin="1.4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4.0;3.3;4.0" dur="3.2s" begin="1.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="520" cy="210" r="2.6" fill="#10B981" opacity="0.68" filter="url(#glow-emerald)">
    <animate attributeName="opacity" values="0.68;0.29;0.68" dur="4.4s" begin="1.7s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2.6;2.1;2.6" dur="4.4s" begin="1.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="620" cy="240" r="3.7" fill="#EF4444" opacity="0.87" filter="url(#glow-red)">
    <animate attributeName="opacity" values="0.87;0.39;0.87" dur="2.9s" begin="1.0s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3.7;3.0;3.7" dur="2.9s" begin="1.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="195" r="2.8" fill="#10B981" opacity="0.71" filter="url(#glow-emerald)">
    <animate attributeName="opacity" values="0.71;0.31;0.71" dur="4.1s" begin="2.0s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2.8;2.3;2.8" dur="4.1s" begin="2.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="790" cy="220" r="3.3" fill="#F59E0B" opacity="0.77" filter="url(#glow-amber)">
    <animate attributeName="opacity" values="0.77;0.34;0.77" dur="3.7s" begin="1.6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3.3;2.7;3.3" dur="3.7s" begin="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Micro background stars -->
  <circle cx="55" cy="45" r="0.9" fill="#ffffff" opacity="0.20"/>
  <circle cx="840" cy="55" r="0.8" fill="#ffffff" opacity="0.18"/>
  <circle cx="480" cy="30" r="0.7" fill="#ffffff" opacity="0.15"/>
  <circle cx="330" cy="255" r="0.8" fill="#ffffff" opacity="0.16"/>
  <circle cx="670" cy="270" r="0.7" fill="#ffffff" opacity="0.14"/>
  <circle cx="870" cy="270" r="0.9" fill="#ffffff" opacity="0.17"/>
  <circle cx="40" cy="240" r="0.8" fill="#ffffff" opacity="0.16"/>
  <circle cx="760" cy="265" r="0.7" fill="#ffffff" opacity="0.13"/>
  <circle cx="100" cy="280" r="0.6" fill="#ffffff" opacity="0.12"/>
  <circle cx="820" cy="30" r="0.7" fill="#ffffff" opacity="0.15"/>

  <!-- Label -->
  <text x="450" y="289" text-anchor="middle" font-family="monospace" font-size="10" fill="#F59E0B" opacity="0.50">✦ contribution constellation — regenerated nightly ✦</text>
</svg>
