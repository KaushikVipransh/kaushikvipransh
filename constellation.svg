    <animate attributeName="r" values="2.8;2.3;2.8" dur="4.1s" begin="2.0s" repeatCount="indefinite"/>
  </circle>

  <!-- Micro background stars -->
  <circle cx="55" cy="45" r="0.9" fill="#CBD5E0" opacity="0.18"/>
  <circle cx="840" cy="55" r="0.8" fill="#CBD5E0" opacity="0.15"/>
  <circle cx="480" cy="30" r="0.7" fill="#CBD5E0" opacity="0.13"/>
  <circle cx="330" cy="255" r="0.8" fill="#CBD5E0" opacity="0.14"/>
  <circle cx="670" cy="270" r="0.7" fill="#CBD5E0" opacity="0.12"/>
  <circle cx="870" cy="270" r="0.9" fill="#CBD5E0" opacity="0.15"/>
  <circle cx="40" cy="240" r="0.8" fill="#CBD5E0" opacity="0.14"/>
  <circle cx="760" cy="265" r="0.7" fill="#CBD5E0" opacity="0.11"/>
  <circle cx="100" cy="280" r="0.6" fill="#CBD5E0" opacity="0.10"/>
  <circle cx="820" cy="30" r="0.7" fill="#CBD5E0" opacity="0.13"/>

  <!-- Label -->
  <text x="450" y="289" text-anchor="middle" font-family="monospace" font-size="10" fill="#A0AAB4" opacity="0.42">✦ contribution constellation — regenerated nightly ✦</text>
</svg>
