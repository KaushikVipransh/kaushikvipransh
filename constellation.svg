    <animate attributeName="r" values="2.4;1.9;2.4" dur="4.2s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="200" r="3.4" fill="#718096" opacity="0.70" filter="url(#glow-steel)">
    <animate attributeName="opacity" values="0.70;0.31;0.70" dur="3.5s" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3.4;2.8;3.4" dur="3.5s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="340" cy="170" r="2.9" fill="#718096" opacity="0.67" filter="url(#glow-steel)">
    <animate attributeName="opacity" values="0.67;0.29;0.67" dur="3.9s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2.9;2.4;2.9" dur="3.9s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="520" cy="210" r="2.6" fill="#718096" opacity="0.63" filter="url(#glow-steel)">
    <animate attributeName="opacity" values="0.63;0.27;0.63" dur="4.4s" begin="1.7s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2.6;2.1;2.6" dur="4.4s" begin="1.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="195" r="2.8" fill="#718096" opacity="0.66" filter="url(#glow-steel)">
