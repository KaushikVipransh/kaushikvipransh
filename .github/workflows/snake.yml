name: Generate arcade animation

on:
  schedule: 
    # execute every 12 hours at the 0th minute
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Step 1: Checkout the repository first
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Generate the Pacman SVG
      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'

      # Step 3: Create the dist folder and move the SVG inside
      - name: Prepare dist directory
        run: |
          mkdir -p dist
          mv *.svg dist/ || true

      # Step 4: Push to the pacman-output branch
      - name: push pacman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
